[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "isbn-tidy"
version = "0.1.0"
description = "Normalise and validate messy ISBN / EAN-13 / UPC-A barcode strings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tessaflint" }]

[tool.setuptools.packages.find]
include = ["isbn_tidy*"]
